                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.source.v1.SetSettingsResponse'
    /v1/sources/{sourceId}/settings/schema:
        get:
            tags:
                - SourcePluginService
            description: GetSettingsSchema returns the JSON Schema of a source's settings.
            operationId: SourcePluginService_GetSettingsSchema
            parameters:
                - name: sourceId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.source.v1.GetSettingsSchemaResponse'
    /v1/whoami:
        get:
            tags:
                - MihonClientsService
            description: WhoAmI describes the caller's credentials. Useful to check a key or token.
            operationId: MihonClientsService_WhoAmI
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.WhoAmIResponse'
components:
    schemas:
        panelarr.mihon.v1.AddStoreRequest:
            type: object
            properties:
                url:
                    type: string
                    description: URL of the store's repo.json, or of a legacy index.min.json.
                expectedSigningKeyFingerprint:
                    type: string
                    description: When set, the store's announced signing key fingerprint must match.
        panelarr.mihon.v1.AddStoreResponse:
            type: object
            properties:
                store:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Store'
        panelarr.mihon.v1.AssignProfileRequest:
            type: object
            properties:
                sourceId:
                    type: string
                profileId:
                    type: string
        panelarr.mihon.v1.AssignProfileResponse:
            type: object
            properties:
                assignment:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Assignment'
        panelarr.mihon.v1.Assignment:
            type: object
            properties:
                sourceId:
                    type: string
                profileId:
                    type: string
                    description: Profile assigned here. Empty when none.
                pushedProfileName:
                    type: string
                    description: Name of the profile pushed by a host, when there is one. It wins over profile_id.
                effective:
                    enum:
                        - PROFILE_ORIGIN_UNSPECIFIED
                        - PROFILE_ORIGIN_NONE
                        - PROFILE_ORIGIN_DEFAULT
                        - PROFILE_ORIGIN_ASSIGNED
                        - PROFILE_ORIGIN_PUSHED
                    type: string
                    description: Where the effective settings come from.
                    format: enum
                effectiveProfileId:
                    type: string
                    description: The profile in effect when it's a local one (assigned or default).
        panelarr.mihon.v1.AvailableExtension:
            type: object
            properties:
                storeId:
                    type: string
                pkgName:
                    type: string
                name:
                    type: string
                versionName:
                    type: string
                versionCode:
                    type: string
                libVersion:
                    type: string
                contentWarning:
                    enum:
                        - CONTENT_WARNING_UNSPECIFIED
                        - CONTENT_WARNING_SAFE
                        - CONTENT_WARNING_MIXED
                        - CONTENT_WARNING_NSFW
                    type: string
                    format: enum
                iconUrl:
                    type: string
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.AvailableSource'
                supported:
                    type: boolean
                    description: Whether this service can load the extension's lib version.
                hasJar:
                    type: boolean
                    description: Whether the store offers a jar (no APK conversion needed).
                installed:
                    type: boolean
                installedVersionName:
                    type: string
                installedVersionCode:
                    type: string
                updateAvailable:
                    type: boolean
                    description: Installed from this store and the store has a newer version.
        panelarr.mihon.v1.AvailableSource:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                lang:
                    type: string
                homeUrl:
                    type: string
        panelarr.mihon.v1.CheckSourcesRequest:
            type: object
            properties:
                sourceIds:
                    type: array
                    items:
                        type: string
                    description: Sources to check. Empty means every loaded source.
                steps:
                    type: array
                    items:
                        enum:
                            - CHECK_STEP_UNSPECIFIED
                            - CHECK_STEP_POPULAR
                            - CHECK_STEP_LATEST
                            - CHECK_STEP_SEARCH
                            - CHECK_STEP_DETAILS
                            - CHECK_STEP_CHAPTERS
                            - CHECK_STEP_PAGES
                            - CHECK_STEP_IMAGE
                        type: string
                        format: enum
                    description: Steps to run. Empty means CHECK_STEP_POPULAR only.
                searchQuery:
                    type: string
                concurrency:
                    type: integer
                    description: Sources checked at the same time. 0 means 4.
                    format: uint32
        panelarr.mihon.v1.CheckSourcesResponse:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.SourceCheck'
        panelarr.mihon.v1.Client:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                scopes:
                    type: array
                    items:
                        type: string
                keyPrefix:
                    type: string
                    description: First characters of the key, to tell keys apart. Not enough to use it.
                createdAt:
                    type: string
                    format: date-time
                rotatedAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
        panelarr.mihon.v1.CreateClientRequest:
            type: object
            properties:
                name:
                    type: string
                scopes:
                    type: array
                    items:
                        type: string
        panelarr.mihon.v1.CreateClientResponse:
            type: object
            properties:
                client:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Client'
                apiKey:
                    type: string
                    description: The API key. Shown only in this response.
        panelarr.mihon.v1.DeleteClientResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.DeleteProfileResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.DeleteSolverResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.Extension:
            type: object
            properties:
                pkgName:
                    type: string
                    description: Package name, the extension's unique identifier.
                name:
                    type: string
                versionName:
                    type: string
                versionCode:
                    type: string
                libVersion:
                    type: string
                    description: extensions-lib version the extension was built against, e.g. "1.4".
                format:
                    enum:
                        - EXTENSION_FORMAT_UNSPECIFIED
                        - EXTENSION_FORMAT_JAR
                        - EXTENSION_FORMAT_APK
                    type: string
                    format: enum
                contentWarning:
                    enum:
                        - CONTENT_WARNING_UNSPECIFIED
                        - CONTENT_WARNING_SAFE
                        - CONTENT_WARNING_MIXED
                        - CONTENT_WARNING_NSFW
                    type: string
                    format: enum
                status:
                    enum:
                        - EXTENSION_STATUS_UNSPECIFIED
                        - EXTENSION_STATUS_LOADED
                        - EXTENSION_STATUS_ERROR
                    type: string
                    format: enum
                loadError:
                    type: string
                    description: Why the extension failed to load. Empty when it loaded.
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.ExtensionSource'
                    description: Sources the extension provides. Empty when it failed to load.
                signingFingerprint:
                    type: string
                    description: SHA-256 (hex, lowercase) of the signing certificate. Empty when unsigned.
                sha256:
                    type: string
                    description: SHA-256 (hex, lowercase) of the file as downloaded or uploaded.
                origin:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.mihon.v1.ExtensionOrigin'
                    description: Where the extension came from.
                installedAt:
                    type: string
                    format: date-time
        panelarr.mihon.v1.ExtensionOrigin:
            type: object
            properties:
                url:
                    type: string
                    description: Installed from this URL.
                upload:
                    type: string
                    description: Installed from uploaded bytes; the original file name.
                storeId:
                    type: string
                    description: Installed from an extension store.
        panelarr.mihon.v1.ExtensionSource:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                lang:
                    type: string
        panelarr.mihon.v1.GetExtensionResponse:
            type: object
            properties:
                extension:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Extension'
        panelarr.mihon.v1.InstallExtensionRequest:
            type: object
            properties:
                url:
                    type: string
                    description: http(s) URL of a .jar or .apk.
                data:
                    type: string
                    description: |-
                        The file itself. Over HTTP/JSON this is base64; large files can also be sent to
                         the multipart upload endpoint described in the service docs.
                    format: bytes
                fileName:
                    type: string
                    description: |-
                        Original file name of uploaded data. Used to tell a jar from an APK and shown in
                         the extension's origin.
                expectedSha256:
                    type: string
                    description: When set, the file's SHA-256 (hex) must match.
                expectedSigningFingerprint:
                    type: string
                    description: When set, the signing certificate's SHA-256 (hex) must match.
        panelarr.mihon.v1.InstallExtensionResponse:
            type: object
            properties:
                extension:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Extension'
        panelarr.mihon.v1.InstallFromStoreRequest:
            type: object
            properties:
                storeId:
                    type: string
                pkgName:
                    type: string
        panelarr.mihon.v1.InstallFromStoreResponse:
            type: object
            properties:
                extension:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Extension'
        panelarr.mihon.v1.ListAssignmentsResponse:
            type: object
            properties:
                assignments:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.Assignment'
                    description: One entry per installed source.
                defaultProfileId:
                    type: string
        panelarr.mihon.v1.ListAvailableResponse:
            type: object
            properties:
                extensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.AvailableExtension'
        panelarr.mihon.v1.ListClientsResponse:
            type: object
            properties:
                clients:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.Client'
        panelarr.mihon.v1.ListExtensionsResponse:
            type: object
            properties:
                extensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.Extension'
        panelarr.mihon.v1.ListProfilesResponse:
            type: object
            properties:
                profiles:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.NetworkProfile'
                defaultProfileId:
                    type: string
                    description: Profile used by sources without an assignment. Empty means none.
        panelarr.mihon.v1.ListSolversResponse:
            type: object
            properties:
                solvers:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.Solver'
        panelarr.mihon.v1.ListStoresResponse:
            type: object
            properties:
                stores:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.Store'
        panelarr.mihon.v1.NetworkProfile:
            type: object
            properties:
                id:
                    type: string
                    description: 'Identifier chosen by the admin: lowercase letters, digits and dashes.'
                name:
                    type: string
                proxy:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.mihon.v1.Proxy'
                    description: Unset means a direct connection.
                solverId:
                    type: string
                    description: Solver to use. Empty means none.
                rateLimit:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.mihon.v1.RateLimit'
                    description: Unset means no rate limit.
                concurrency:
                    type: integer
                    description: Maximum parallel requests per source. 0 means no limit.
                    format: uint32
                userAgentMode:
                    enum:
                        - USER_AGENT_MODE_UNSPECIFIED
                        - USER_AGENT_MODE_FIXED
                        - USER_AGENT_MODE_RANDOM_DESKTOP
                        - USER_AGENT_MODE_FROM_SOLVER
                    type: string
                    format: enum
                userAgent:
                    type: string
                    description: Used when user_agent_mode is FIXED.
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Extra headers added to every request.
                sharedCookieJar:
                    type: string
                    description: |-
                        Name of a cookie jar shared by every source using it. Empty means each source
                         keeps its own jar.
                connectTimeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                readTimeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                callTimeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
        panelarr.mihon.v1.Proxy:
            type: object
            properties:
                url:
                    type: string
                    description: http://, https:// or socks5:// URL without credentials.
                username:
                    type: string
                password:
                    type: string
                    description: Write-only. Never returned; has_password says whether one is stored.
                hasPassword:
                    type: boolean
        panelarr.mihon.v1.PutProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/panelarr.mihon.v1.NetworkProfile'
        panelarr.mihon.v1.PutSolverResponse:
            type: object
            properties:
                solver:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Solver'
        panelarr.mihon.v1.RateLimit:
            type: object
            properties:
                requests:
                    type: integer
                    description: Requests allowed per period.
                    format: uint32
                period:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                perHost:
                    type: boolean
                    description: Count requests per target host instead of per source.
        panelarr.mihon.v1.RefreshStoreRequest:
            type: object
            properties:
                storeId:
                    type: string
        panelarr.mihon.v1.RefreshStoreResponse:
            type: object
            properties:
                store:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Store'
        panelarr.mihon.v1.ReloadExtensionRequest:
            type: object
            properties:
                pkgName:
                    type: string
        panelarr.mihon.v1.ReloadExtensionResponse:
            type: object
            properties:
                extension:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Extension'
        panelarr.mihon.v1.RemoveStoreResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.RotateClientKeyRequest:
            type: object
            properties:
                clientId:
                    type: string
        panelarr.mihon.v1.RotateClientKeyResponse:
            type: object
            properties:
                client:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Client'
                apiKey:
                    type: string
                    description: The new API key. Shown only in this response.
        panelarr.mihon.v1.SetDefaultProfileRequest:
            type: object
            properties:
                profileId:
                    type: string
        panelarr.mihon.v1.SetDefaultProfileResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.SetHealthCheckRequest:
            type: object
            properties:
                sourceId:
                    type: string
                enabled:
                    type: boolean
        panelarr.mihon.v1.SetHealthCheckResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.Solver:
            type: object
            properties:
                id:
                    type: string
                    description: 'Identifier chosen by the admin: lowercase letters, digits and dashes.'
                name:
                    type: string
                type:
                    enum:
                        - SOLVER_TYPE_UNSPECIFIED
                        - SOLVER_TYPE_FLARESOLVERR
                        - SOLVER_TYPE_BYPARR
                    type: string
                    format: enum
                url:
                    type: string
                    description: Base URL, e.g. http://flaresolverr:8191.
                sessionTtl:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long clearance cookies from one solve are reused.
                maxTimeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Upper bound for one solve.
                asResponseFallback:
                    type: boolean
                    description: Use the solver's own response body when a fresh request still fails.
        panelarr.mihon.v1.SourceCheck:
            type: object
            properties:
                sourceId:
                    type: string
                sourceName:
                    type: string
                lang:
                    type: string
                pkgName:
                    type: string
                ok:
                    type: boolean
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.mihon.v1.StepResult'
                checkedAt:
                    type: string
                    format: date-time
        panelarr.mihon.v1.StepResult:
            type: object
            properties:
                step:
                    enum:
                        - CHECK_STEP_UNSPECIFIED
                        - CHECK_STEP_POPULAR
                        - CHECK_STEP_LATEST
                        - CHECK_STEP_SEARCH
                        - CHECK_STEP_DETAILS
                        - CHECK_STEP_CHAPTERS
                        - CHECK_STEP_PAGES
                        - CHECK_STEP_IMAGE
                    type: string
                    format: enum
                ok:
                    type: boolean
                skipped:
                    type: boolean
                    description: 'Not run: an earlier step it needs failed or found nothing, or the source can''t do it.'
                reason:
                    type: string
                    description: Error reason (e.g. "SOURCE_DOWN") or gRPC code name when it failed.
                message:
                    type: string
                duration:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                detail:
                    type: string
                    description: What the step found, e.g. "20 series" or "image/webp, 350 KB".
        panelarr.mihon.v1.Store:
            type: object
            properties:
                id:
                    type: string
                    description: Identifier derived from the store URL.
                url:
                    type: string
                    description: URL the store was added with.
                name:
                    type: string
                badgeLabel:
                    type: string
                    description: Short label the store wants shown next to its extensions.
                contact:
                    type: string
                    description: Contact or website the store announces.
                signingKeyFingerprint:
                    type: string
                    description: |-
                        Pinned SHA-256 (hex, lowercase) of the store's signing certificate. Empty for a
                         legacy index, which announces no key.
                format:
                    enum:
                        - STORE_FORMAT_UNSPECIFIED
                        - STORE_FORMAT_EXTENSION_STORE
                        - STORE_FORMAT_LEGACY_INDEX
                    type: string
                    format: enum
                addedAt:
                    type: string
                    format: date-time
                refreshedAt:
                    type: string
                    format: date-time
                lastError:
                    type: string
                    description: Error of the last refresh. Empty when it worked.
                extensionCount:
                    type: integer
                    format: uint32
        panelarr.mihon.v1.UninstallExtensionResponse:
            type: object
            properties: {}
        panelarr.mihon.v1.UpdateClientRequest:
            type: object
            properties:
                clientId:
                    type: string
                name:
                    type: string
                    description: New name. Empty keeps the current one.
                scopes:
                    type: array
                    items:
                        type: string
                    description: New scopes. Empty keeps the current ones.
        panelarr.mihon.v1.UpdateClientResponse:
            type: object
            properties:
                client:
                    $ref: '#/components/schemas/panelarr.mihon.v1.Client'
        panelarr.mihon.v1.WhoAmIResponse:
            type: object
            properties:
                kind:
                    enum:
                        - PRINCIPAL_KIND_UNSPECIFIED
                        - PRINCIPAL_KIND_ADMIN
                        - PRINCIPAL_KIND_CLIENT
                    type: string
                    format: enum
                clientId:
                    type: string
                    description: Set for clients.
                name:
                    type: string
                scopes:
                    type: array
                    items:
                        type: string
        panelarr.source.v1.Chapter:
            type: object
            properties:
                key:
                    type: string
                    description: Opaque key of the chapter within its source.
                name:
                    type: string
                number:
                    type: number
                    description: Chapter number, when the source knows it.
                    format: double
                volume:
                    type: string
                    description: Volume, when the source knows it.
                scanlator:
                    type: string
                uploadedAt:
                    type: string
                    format: date-time
                lang:
                    type: string
                    description: Language as a BCP 47 tag, when it differs from the source's language.
                url:
                    type: string
                    description: Web address of the chapter.
        panelarr.source.v1.CheckboxFilter:
            type: object
            properties:
                value:
                    type: boolean
        panelarr.source.v1.Filter:
            type: object
            properties:
                name:
                    type: string
                    description: Label shown to users.
                header:
                    $ref: '#/components/schemas/panelarr.source.v1.HeaderFilter'
                separator:
                    $ref: '#/components/schemas/panelarr.source.v1.SeparatorFilter'
                text:
                    $ref: '#/components/schemas/panelarr.source.v1.TextFilter'
                checkbox:
                    $ref: '#/components/schemas/panelarr.source.v1.CheckboxFilter'
                triState:
                    $ref: '#/components/schemas/panelarr.source.v1.TriStateFilter'
                select:
                    $ref: '#/components/schemas/panelarr.source.v1.SelectFilter'
                sort:
                    $ref: '#/components/schemas/panelarr.source.v1.SortFilter'
                group:
                    $ref: '#/components/schemas/panelarr.source.v1.GroupFilter'
            description: |-
                Filter is one search filter. Filters have no stable keys: they are addressed by
                 their position (see FilterValue.path).
        panelarr.source.v1.FilterValue:
            type: object
            properties:
                path:
                    type: array
                    items:
                        type: integer
                        format: uint32
                    description: |-
                        Position of the filter: [index] for a top-level filter, [group index, child index]
                         for a filter inside a group.
                text:
                    type: string
                checkbox:
                    type: boolean
                triState:
                    enum:
                        - TRI_STATE_UNSPECIFIED
                        - TRI_STATE_IGNORE
                        - TRI_STATE_INCLUDE
                        - TRI_STATE_EXCLUDE
                    type: string
                    format: enum
                select:
                    type: integer
                    format: uint32
                sort:
                    $ref: '#/components/schemas/panelarr.source.v1.SortSelection'
            description: FilterValue sets the value of one filter for a search.
        panelarr.source.v1.GetFiltersResponse:
            type: object
            properties:
                filters:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Filter'
                    description: Filters in display order, with their default values.
        panelarr.source.v1.GetInfoResponse:
            type: object
            properties:
                info:
                    $ref: '#/components/schemas/panelarr.source.v1.PluginInfo'
        panelarr.source.v1.GetSeriesResponse:
            type: object
            properties:
                series:
                    $ref: '#/components/schemas/panelarr.source.v1.Series'
        panelarr.source.v1.GetSettingsResponse:
            type: object
            properties:
                values:
                    type: object
        panelarr.source.v1.GetSettingsSchemaResponse:
            type: object
            properties:
                schema:
                    type: object
                    description: JSON Schema (draft 2020-12) describing the settings object.
        panelarr.source.v1.GetSourceResponse:
            type: object
            properties:
                source:
                    $ref: '#/components/schemas/panelarr.source.v1.Source'
        panelarr.source.v1.GroupFilter:
            type: object
            properties:
                filters:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Filter'
            description: GroupFilter holds child filters (usually checkboxes, tri-states, texts or selects).
        panelarr.source.v1.HeaderFilter:
            type: object
            properties: {}
            description: HeaderFilter is a label with no value.
        panelarr.source.v1.HealthResponse:
            type: object
            properties:
                status:
                    enum:
                        - HEALTH_STATUS_UNSPECIFIED
                        - HEALTH_STATUS_SERVING
                        - HEALTH_STATUS_DEGRADED
                        - HEALTH_STATUS_NOT_SERVING
                    type: string
                    format: enum
                message:
                    type: string
                    description: Optional detail for humans.
        panelarr.source.v1.LatestResponse:
            type: object
            properties:
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Series'
                hasNextPage:
                    type: boolean
        panelarr.source.v1.Limits:
            type: object
            properties:
                maxConcurrencyPerSource:
                    type: integer
                    description: Maximum parallel requests the plugin wants per source. 0 means no limit declared.
                    format: uint32
                defaultRateLimit:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.RateLimit'
                    description: Default request rate per source. Unset means no limit declared.
        panelarr.source.v1.ListChaptersResponse:
            type: object
            properties:
                chapters:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Chapter'
        panelarr.source.v1.ListPagesResponse:
            type: object
            properties:
                pages:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Page'
        panelarr.source.v1.ListSourcesResponse:
            type: object
            properties:
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Source'
        panelarr.source.v1.NetworkProfile:
            type: object
            properties:
                name:
                    type: string
                    description: Name of the profile on the host, for display and logs.
                proxy:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.Proxy'
                    description: Unset means a direct connection.
                solver:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.Solver'
                    description: Unset means no challenge solver.
                rateLimit:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.RateLimit'
                    description: Unset means the plugin's default.
                concurrency:
                    type: integer
                    description: Maximum parallel requests. 0 means the plugin's default.
                    format: uint32
                userAgent:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.UserAgent'
                    description: Unset means the plugin's default user agent.
                dohUrl:
                    type: string
                    description: DNS-over-HTTPS resolver URL. Empty means the system resolver.
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: Extra headers added to every request.
                sharedCookieJar:
                    type: string
                    description: Name of a cookie jar shared with other sources. Empty means a jar of its own.
                timeouts:
                    $ref: '#/components/schemas/panelarr.source.v1.Timeouts'
            description: NetworkProfile is everything a plugin needs to make requests for one source.
        panelarr.source.v1.Page:
            type: object
            properties:
                index:
                    type: integer
                    description: 0-based position in the chapter.
                    format: uint32
                ref:
                    type: string
                    description: Opaque reference to pass to FetchImage.
                imageUrl:
                    type: string
                    description: |-
                        Direct image URL when known. It may need the source's headers or cookies, so
                         fetching through FetchImage is preferred.
        panelarr.source.v1.PluginInfo:
            type: object
            properties:
                id:
                    type: string
                    description: Stable identifier of the plugin, e.g. "mihon-source".
                name:
                    type: string
                    description: Human-readable name.
                version:
                    type: string
                    description: Version of the plugin itself.
                contracts:
                    type: array
                    items:
                        type: string
                    description: Contracts the plugin implements, e.g. "panelarr.source.v1".
                capabilities:
                    type: array
                    items:
                        enum:
                            - PLUGIN_CAPABILITY_UNSPECIFIED
                            - PLUGIN_CAPABILITY_NETWORK_PROFILES
                            - PLUGIN_CAPABILITY_DYNAMIC_SOURCES
                        type: string
                        format: enum
                    description: Features of the plugin as a whole. Per-source features are on Source.
                limits:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.Limits'
                    description: Limits the plugin asks hosts to respect. Hosts should enforce them too.
                configSchema:
                    type: object
                    description: |-
                        JSON Schema of the plugin-level configuration the plugin expects from a host.
                         Unset when the plugin needs none.
                commonServices:
                    type: array
                    items:
                        enum:
                            - COMMON_SERVICE_UNSPECIFIED
                            - COMMON_SERVICE_NETWORK_PROFILE
                            - COMMON_SERVICE_SOLVER
                        type: string
                        format: enum
                    description: Common services the plugin can use when a host provides them.
        panelarr.source.v1.PopularResponse:
            type: object
            properties:
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Series'
                hasNextPage:
                    type: boolean
        panelarr.source.v1.Proxy:
            type: object
            properties:
                url:
                    type: string
                    description: http://, https:// or socks5:// URL without credentials.
                username:
                    type: string
                password:
                    type: string
        panelarr.source.v1.RateLimit:
            type: object
            properties:
                requests:
                    type: integer
                    description: Requests allowed per period.
                    format: uint32
                period:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Length of the period.
                burst:
                    type: integer
                    description: Extra requests allowed in a burst. 0 means none.
                    format: uint32
                scope:
                    enum:
                        - RATE_LIMIT_SCOPE_UNSPECIFIED
                        - RATE_LIMIT_SCOPE_SOURCE
                        - RATE_LIMIT_SCOPE_HOST
                    type: string
                    description: What the limit counts.
                    format: enum
        panelarr.source.v1.ResolveUrlRequest:
            type: object
            properties:
                url:
                    type: string
                sourceId:
                    type: string
                    description: Source to ask. Empty means every source that may know the URL.
        panelarr.source.v1.ResolveUrlResponse:
            type: object
            properties:
                sourceId:
                    type: string
                series:
                    $ref: '#/components/schemas/panelarr.source.v1.Series'
                bestEffort:
                    type: boolean
                    description: |-
                        The source has no URL resolver of its own and the plugin found the series another
                         way (e.g. by searching for the URL). The match may be wrong.
        panelarr.source.v1.SearchRequest:
            type: object
            properties:
                sourceId:
                    type: string
                page:
                    type: integer
                    description: 1-based page number.
                    format: uint32
                query:
                    type: string
                filters:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.FilterValue'
                    description: Filters to change from their defaults. Filters not listed keep their default.
        panelarr.source.v1.SearchResponse:
            type: object
            properties:
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/panelarr.source.v1.Series'
                hasNextPage:
                    type: boolean
        panelarr.source.v1.SelectFilter:
            type: object
            properties:
                options:
                    type: array
                    items:
                        type: string
                selected:
                    type: integer
                    description: Index into options.
                    format: uint32
        panelarr.source.v1.SeparatorFilter:
            type: object
            properties: {}
            description: SeparatorFilter is a visual divider with no value.
        panelarr.source.v1.Series:
            type: object
            properties:
                key:
                    type: string
                    description: Opaque key of the series within its source.
                title:
                    type: string
                altTitles:
                    type: array
                    items:
                        type: string
                authors:
                    type: array
                    items:
                        type: string
                artists:
                    type: array
                    items:
                        type: string
                description:
                    type: string
                genres:
                    type: array
                    items:
                        type: string
                status:
                    enum:
                        - SERIES_STATUS_UNSPECIFIED
                        - SERIES_STATUS_ONGOING
                        - SERIES_STATUS_COMPLETED
                        - SERIES_STATUS_LICENSED
                        - SERIES_STATUS_PUBLISHING_FINISHED
                        - SERIES_STATUS_CANCELLED
                        - SERIES_STATUS_ON_HIATUS
                    type: string
                    format: enum
                coverUrl:
                    type: string
                url:
                    type: string
                    description: Web address of the series, for display and "open in browser".
                detailsLoaded:
                    type: boolean
                    description: |-
                        False when only list fields (key, title, cover) are filled in. Call GetSeries for
                         the rest.
        panelarr.source.v1.SetNetworkProfileRequest:
            type: object
            properties:
                sourceId:
                    type: string
                profile:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.NetworkProfile'
                    description: Unset removes the pushed profile.
        panelarr.source.v1.SetNetworkProfileResponse:
            type: object
            properties: {}
        panelarr.source.v1.SetSettingsRequest:
            type: object
            properties:
                sourceId:
                    type: string
                values:
                    type: object
                    description: Settings to change. Keys not listed keep their value.
        panelarr.source.v1.SetSettingsResponse:
            type: object
            properties:
                values:
                    type: object
        panelarr.source.v1.Solver:
            type: object
            properties:
                type:
                    enum:
                        - SOLVER_TYPE_UNSPECIFIED
                        - SOLVER_TYPE_FLARESOLVERR
                        - SOLVER_TYPE_BYPARR
                    type: string
                    format: enum
                url:
                    type: string
                    description: Base URL of the solver, e.g. http://flaresolverr:8191.
                sessionTtl:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long a solver session or its clearance cookies are reused.
                maxTimeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Upper bound for one solve.
                asResponseFallback:
                    type: boolean
                    description: Use the solver's own response body when a fresh request still fails.
        panelarr.source.v1.SortFilter:
            type: object
            properties:
                options:
                    type: array
                    items:
                        type: string
                selection:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.SortSelection'
                    description: Unset when no sort is selected.
        panelarr.source.v1.SortSelection:
            type: object
            properties:
                index:
                    type: integer
                    description: Index into options.
                    format: uint32
                ascending:
                    type: boolean
        panelarr.source.v1.Source:
            type: object
            properties:
                id:
                    type: string
                    description: Identifier of the source, unique within the plugin and stable across restarts.
                name:
                    type: string
                lang:
                    type: string
                    description: Language as a BCP 47 tag, or "all" / "multi" for multi-language sources.
                contentRating:
                    enum:
                        - CONTENT_RATING_UNSPECIFIED
                        - CONTENT_RATING_SAFE
                        - CONTENT_RATING_MIXED
                        - CONTENT_RATING_NSFW
                    type: string
                    format: enum
                iconUrl:
                    type: string
                    description: |-
                        URL of an icon for the source, if the plugin has one. It may be a path relative to
                         the plugin's own address (e.g. "/v1/sources/123/icon"), fetched with the same
                         credentials as the API.
                capabilities:
                    type: array
                    items:
                        enum:
                            - SOURCE_CAPABILITY_UNSPECIFIED
                            - SOURCE_CAPABILITY_LATEST
                            - SOURCE_CAPABILITY_SEARCH
                            - SOURCE_CAPABILITY_FILTERS
                            - SOURCE_CAPABILITY_RESOLVE_URL
                            - SOURCE_CAPABILITY_SETTINGS
                            - SOURCE_CAPABILITY_NEEDS_WEBVIEW
                            - SOURCE_CAPABILITY_NSFW
                        type: string
                        format: enum
                homeUrl:
                    type: string
                    description: Web address of the source, for display.
                health:
                    allOf:
                        - $ref: '#/components/schemas/panelarr.source.v1.SourceHealth'
                    description: The result of the plugin's last check of this source, when it checks sources.
        panelarr.source.v1.SourceHealth:
            type: object
            properties:
                status:
                    enum:
                        - SOURCE_HEALTH_STATUS_UNSPECIFIED
                        - SOURCE_HEALTH_STATUS_OK
                        - SOURCE_HEALTH_STATUS_FAILING
                    type: string
                    format: enum
                reason:
                    type: string
                    description: |-
                        ErrorReason name without the prefix (e.g. "SOURCE_DOWN"), or "NEEDS_WEBVIEW", when
                         failing. Empty when OK.
                message:
                    type: string
                    description: Detail for humans.
                latency:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long the check took.
                checkedAt:
                    type: string
                    format: date-time
                checksDisabled:
                    type: boolean
                    description: Scheduled checks are turned off for this source.
            description: SourceHealth is what a plugin last saw when it checked a source itself.
        panelarr.source.v1.TextFilter:
            type: object
            properties:
                value:
                    type: string
        panelarr.source.v1.Timeouts:
            type: object
            properties:
                connect:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                read:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                call:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Whole call, including redirects and retries.
        panelarr.source.v1.TriStateFilter:
            type: object
            properties:
                value:
                    enum:
                        - TRI_STATE_UNSPECIFIED
                        - TRI_STATE_IGNORE
                        - TRI_STATE_INCLUDE
                        - TRI_STATE_EXCLUDE
                    type: string
                    format: enum
        panelarr.source.v1.UserAgent:
            type: object
            properties:
                fixed:
                    type: string
                    description: Always this value.
                randomDesktop:
                    type: boolean
                    description: A realistic desktop browser user agent chosen by the plugin.
                fromSolver:
                    type: boolean
                    description: The user agent the solver reports, so it matches the clearance cookies.
    securitySchemes:
        bearer:
            type: http
            description: The admin token or a client API key.
            scheme: bearer
security:
    - bearer: []
tags:
    - name: MihonAdminService
      description: MihonAdminService manages installed Mihon extensions. Needs the `admin` scope.
    - name: MihonClientsService
      description: |-
        MihonClientsService manages API clients: callers such as a Panelarr server or a
         script, each with its own API key and scopes.

         Scopes:
         - `sources:read`: browse sources (panelarr.source.v1 reads).
         - `sources:write`: change source settings and push network profiles.
         - `metrics`: read the Prometheus metrics at /metrics.
         - `admin`: everything, including this service.

         Keys are shown once, when created or rotated, and stored only as hashes.
         Every method needs the `admin` scope except WhoAmI, which any valid key may call.
    - name: MihonIntegrationsService
      description: |-
        MihonIntegrationsService manages the network settings sources use: challenge
         solvers, network profiles and which profile each source uses. Needs the `admin`
         scope.

         The chain: a solver is used by a profile (solver_id), and a profile applies to the
         sources it's assigned to, or to every other source when it's the default profile.

         A source uses, in order: a profile pushed by a host (SetNetworkProfile in
         panelarr.source.v1), the profile assigned to it here, the default profile, or a
         direct connection when there is none.
    - name: MihonStoresService
      description: |-
        MihonStoresService manages extension stores: indexes of extensions published by a
         third party. No store is configured by default. Needs the `admin` scope.

         A store is pinned to the signing key fingerprint it announces when it's added.
         Every install from the store must be signed with that key, and a refresh that sees
         a different key fails instead of changing the pin.
    - name: SourcePluginService
      description: |-
        SourcePluginService is the contract every Panelarr source plugin implements.

         A plugin serves one or more sources. Each source is a catalogue of series that can be
         browsed (popular, latest, search), and each series has chapters made of pages.

         Keys (series keys, chapter keys, page refs) are opaque strings chosen by the plugin.
         Callers store them and pass them back as they are, and never parse them.

         Errors use gRPC status codes. When a request fails because of the upstream source,
         the status carries a google.rpc.ErrorInfo whose `reason` is one of ErrorReason's
         names without the `ERROR_REASON_` prefix (for example `RATE_LIMITED`), and whose
         `domain` is `source.panelarr`. RATE_LIMITED may also carry a google.rpc.RetryInfo.
