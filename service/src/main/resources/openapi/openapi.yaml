                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.ListProfilesResponse'
    /v1/admin/profiles/{profile.id}:
        put:
            tags:
                - MihonIntegrationsService
            description: |-
                PutProfile creates or replaces a profile. A proxy password left empty keeps the
                 stored one.
            operationId: MihonIntegrationsService_PutProfile
            parameters:
                - name: profile.id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.NetworkProfile'
                required: true
            responses:
                "200":
                    description: OK
                    content:
