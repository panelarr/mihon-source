            operationId: MihonStoresService_ListAvailable
            parameters:
                - name: storeId
                  in: query
                  description: Only this store. Empty means all stores.
                  schema:
                    type: string
                - name: lang
                  in: query
                  description: Only extensions with a source in this language.
                  schema:
                    type: string
                - name: query
                  in: query
                  description: Case-insensitive match on the extension or source name.
                  schema:
                    type: string
                - name: updatesOnly
                  in: query
                  description: Only installed extensions that have an update.
                  schema:
                    type: boolean
            responses:
                "200":
