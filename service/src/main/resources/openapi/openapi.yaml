openapi: 3.0.3
info:
    title: mihon-source API
    description: 'Runs Mihon extensions and serves their sources. `panelarr.source.v1` is the source API and `panelarr.mihon.v1` is the admin API. Every endpoint except /v1/health needs `Authorization: Bearer <token>`: the admin token, or a client API key with the right scope. Images are served by `GET /v1/sources/{sourceId}/image?ref=...`, and extensions can be uploaded as multipart form data to `POST /v1/admin/extensions/upload` (field `file`).'
    version: v1
paths:
    /v1/admin/assignments:
        get:
            tags:
                - MihonIntegrationsService
            description: ListAssignments lists which profile each source uses and why.
            operationId: MihonIntegrationsService_ListAssignments
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.ListAssignmentsResponse'
    /v1/admin/assignments/{sourceId}:
        put:
            tags:
                - MihonIntegrationsService
            description: |-
                AssignProfile sets the profile of one source. An empty profile_id removes the
                 assignment, so the source falls back to the default profile.
            operationId: MihonIntegrationsService_AssignProfile
            parameters:
                - name: sourceId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.AssignProfileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.AssignProfileResponse'
    /v1/admin/checks:
        post:
            tags:
                - MihonAdminService
            description: |-
                CheckSources runs checks against sources now: by default the first page of popular,
                 or the steps asked for, each feeding the next (a series from the list, a chapter of
                 the series, a page of the chapter). It records the result as each source's health.
            operationId: MihonAdminService_CheckSources
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.CheckSourcesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.CheckSourcesResponse'
    /v1/admin/clients:
        get:
            tags:
                - MihonClientsService
            operationId: MihonClientsService_ListClients
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.ListClientsResponse'
        post:
            tags:
                - MihonClientsService
            description: |-
                CreateClient creates a client and returns its API key. The key is never shown
                 again.
            operationId: MihonClientsService_CreateClient
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.CreateClientRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.CreateClientResponse'
    /v1/admin/clients/{clientId}:
        delete:
            tags:
                - MihonClientsService
            operationId: MihonClientsService_DeleteClient
            parameters:
                - name: clientId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.DeleteClientResponse'
        patch:
            tags:
                - MihonClientsService
            description: UpdateClient changes a client's name or scopes. The key stays the same.
            operationId: MihonClientsService_UpdateClient
            parameters:
                - name: clientId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.UpdateClientRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.UpdateClientResponse'
    /v1/admin/clients/{clientId}/rotate:
        post:
            tags:
                - MihonClientsService
            description: RotateClientKey replaces a client's API key. The old key stops working at once.
            operationId: MihonClientsService_RotateClientKey
            parameters:
                - name: clientId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.RotateClientKeyRequest'
                required: true
            responses:
