            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.InstallExtensionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.InstallExtensionResponse'
    /v1/admin/extensions/{pkgName}:
        get:
            tags:
                - MihonAdminService
            description: GetExtension returns one installed extension.
            operationId: MihonAdminService_GetExtension
            parameters:
                - name: pkgName
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.GetExtensionResponse'
        delete:
            tags:
                - MihonAdminService
            description: |-
                UninstallExtension removes an extension, its sources and its files. Source
                 settings and cookies are kept unless `delete_data` is set.
            operationId: MihonAdminService_UninstallExtension
            parameters:
                - name: pkgName
                  in: path
                  required: true
                  schema:
                    type: string
                - name: deleteData
                  in: query
                  description: Also delete the settings and cookies of the extension's sources.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.UninstallExtensionResponse'
    /v1/admin/extensions/{pkgName}/reload:
        post:
            tags:
                - MihonAdminService
            description: ReloadExtension unloads an extension and loads it again from its installed file.
            operationId: MihonAdminService_ReloadExtension
            parameters:
                - name: pkgName
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.ReloadExtensionRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.ReloadExtensionResponse'
