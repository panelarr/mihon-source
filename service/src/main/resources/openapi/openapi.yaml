    /v1/admin/solvers/{solver.id}:
        put:
            tags:
                - MihonIntegrationsService
            description: |-
                PutSolver creates or replaces a solver. A solver is only used through a network
                 profile. As a convenience, adding a solver while no profiles exist at all also
                 creates a profile "default" that uses it and makes it the default profile, so every
                 source starts using the solver right away.
            operationId: MihonIntegrationsService_PutSolver
            parameters:
                - name: solver.id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/panelarr.mihon.v1.Solver'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.PutSolverResponse'
    /v1/admin/solvers/{solverId}:
        delete:
            tags:
                - MihonIntegrationsService
            description: DeleteSolver fails while a profile still uses the solver.
            operationId: MihonIntegrationsService_DeleteSolver
            parameters:
                - name: solverId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.DeleteSolverResponse'
