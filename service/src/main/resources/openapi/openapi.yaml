                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.SetDefaultProfileResponse'
    /v1/admin/extensions:
        get:
            tags:
                - MihonAdminService
            description: ListExtensions lists installed extensions, including ones that failed to load.
            operationId: MihonAdminService_ListExtensions
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/panelarr.mihon.v1.ListExtensionsResponse'
        post:
            tags:
                - MihonAdminService
            description: |-
                InstallExtension installs (or replaces) an extension from a URL or from uploaded
                 bytes. A jar is used as is; an APK is converted to a jar first. When an expected
