syntax = "proto3";

package panelarr.mihon.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "panelarr.mihon.v1";

// MihonAdminService manages installed Mihon extensions. Needs the `admin` scope.
service MihonAdminService {
  // ListExtensions lists installed extensions, including ones that failed to load.
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse) {
    option (google.api.http) = {get: "/v1/admin/extensions"};
  }

  // GetExtension returns one installed extension.
  rpc GetExtension(GetExtensionRequest) returns (GetExtensionResponse) {
    option (google.api.http) = {get: "/v1/admin/extensions/{pkg_name}"};
  }

  // InstallExtension installs (or replaces) an extension from a URL or from uploaded
  // bytes. A jar is used as is; an APK is converted to a jar first. When an expected
  // SHA-256 or signing fingerprint is given and doesn't match, nothing is installed.
  rpc InstallExtension(InstallExtensionRequest) returns (InstallExtensionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/extensions"
      body: "*"
    };
  }

  // UninstallExtension removes an extension, its sources and its files. Source
  // settings and cookies are kept unless `delete_data` is set.
  rpc UninstallExtension(UninstallExtensionRequest) returns (UninstallExtensionResponse) {
    option (google.api.http) = {delete: "/v1/admin/extensions/{pkg_name}"};
  }

  // ReloadExtension unloads an extension and loads it again from its installed file.
  rpc ReloadExtension(ReloadExtensionRequest) returns (ReloadExtensionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/extensions/{pkg_name}/reload"
      body: "*"
    };
  }
}

message Extension {
  // Package name, the extension's unique identifier.
  string pkg_name = 1;
  string name = 2;
  string version_name = 3;
  int64 version_code = 4;
  // extensions-lib version the extension was built against, e.g. "1.4".
  string lib_version = 5;
  ExtensionFormat format = 6;
  ContentWarning content_warning = 7;
  ExtensionStatus status = 8;
  // Why the extension failed to load. Empty when it loaded.
  string load_error = 9;
  // Sources the extension provides. Empty when it failed to load.
  repeated ExtensionSource sources = 10;
  // SHA-256 (hex, lowercase) of the signing certificate. Empty when unsigned.
  string signing_fingerprint = 11;
  // SHA-256 (hex, lowercase) of the file as downloaded or uploaded.
  string sha256 = 12;
  // Where the extension came from.
  ExtensionOrigin origin = 13;
  google.protobuf.Timestamp installed_at = 14;
}

enum ExtensionFormat {
  EXTENSION_FORMAT_UNSPECIFIED = 0;
  EXTENSION_FORMAT_JAR = 1;
  // Converted from an APK at install time.
  EXTENSION_FORMAT_APK = 2;
}

enum ContentWarning {
  CONTENT_WARNING_UNSPECIFIED = 0;
  CONTENT_WARNING_SAFE = 1;
  CONTENT_WARNING_MIXED = 2;
  CONTENT_WARNING_NSFW = 3;
}

enum ExtensionStatus {
  EXTENSION_STATUS_UNSPECIFIED = 0;
  EXTENSION_STATUS_LOADED = 1;
  // Installed, but loading failed. See load_error.
  EXTENSION_STATUS_ERROR = 2;
}

message ExtensionSource {
  string id = 1;
  string name = 2;
  string lang = 3;
}

message ExtensionOrigin {
  oneof kind {
    // Installed from this URL.
    string url = 1;
    // Installed from uploaded bytes; the original file name.
    string upload = 2;
    // Installed from an extension store.
    string store_id = 3;
  }
}

message ListExtensionsRequest {}

message ListExtensionsResponse {
  repeated Extension extensions = 1;
}

message GetExtensionRequest {
  string pkg_name = 1;
}

message GetExtensionResponse {
  Extension extension = 1;
}

message InstallExtensionRequest {
  oneof file {
    // http(s) URL of a .jar or .apk.
    string url = 1;
    // The file itself. Over HTTP/JSON this is base64; large files can also be sent to
    // the multipart upload endpoint described in the service docs.
    bytes data = 2;
  }
  // Original file name of uploaded data. Used to tell a jar from an APK and shown in
  // the extension's origin.
  string file_name = 3;
  // When set, the file's SHA-256 (hex) must match.
  string expected_sha256 = 4;
  // When set, the signing certificate's SHA-256 (hex) must match.
  string expected_signing_fingerprint = 5;
}

message InstallExtensionResponse {
  Extension extension = 1;
}

message UninstallExtensionRequest {
  string pkg_name = 1;
  // Also delete the settings and cookies of the extension's sources.
  bool delete_data = 2;
}

message UninstallExtensionResponse {}

message ReloadExtensionRequest {
  string pkg_name = 1;
}

message ReloadExtensionResponse {
  Extension extension = 1;
}
