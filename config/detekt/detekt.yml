# Overrides on top of detekt's default rule set (buildUponDefaultConfig = true).

style:
  MaxLineLength:
    # Same limit as ktlint (.editorconfig).
    maxLineLength: 140
  ReturnCount:
    max: 3
    excludeGuardClauses: true

complexity:
  TooManyFunctions:
    allowedFunctionsPerClass: 15
    allowedFunctionsPerFile: 20
    allowedFunctionsPerObject: 15
