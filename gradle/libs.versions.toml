[versions]
kotlin = "2.4.21"
detekt = "2.0.0-alpha.6"
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
junit = "6.1.3"
armeria = "1.42.0"
# gRPC and protobuf follow the versions Armeria is built with.
grpc = "1.84.0"
grpcKotlin = "1.4.3"
protobuf = "3.25.9"
protobufPlugin = "0.10.0"
buf = "1.73.0"
coroutines = "1.11.0"
serialization = "1.11.0"
logback = "1.5.20"
swaggerUi = "5.33.1"
apksig = "9.4.1"
dex2jar = "2.4.38"
asm = "9.11"
okhttp = "5.5.0"
jsoup = "1.23.2"
rxjava = "1.3.8"
injekt = "1.16.1"
zstdOkio = "0.4.0"
orgJson = "20260814"
r8 = "9.5.23"
bouncycastle = "1.86"
# The admin SPA (admin/): the Gradle plugin downloads this Node.js LTS itself.
nodeGradle = "7.1.0"
nodejs = "24.21.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

armeria-bom = { module = "com.linecorp.armeria:armeria-bom", version.ref = "armeria" }
armeria-core = { module = "com.linecorp.armeria:armeria" }
armeria-grpc = { module = "com.linecorp.armeria:armeria-grpc" }
armeria-grpc-kotlin = { module = "com.linecorp.armeria:armeria-grpc-kotlin" }
armeria-kotlin = { module = "com.linecorp.armeria:armeria-kotlin" }
armeria-junit5 = { module = "com.linecorp.armeria:armeria-junit5" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
swagger-ui = { module = "org.webjars:swagger-ui", version.ref = "swaggerUi" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
dex2jar = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
zstd-okio = { module = "com.squareup.zstd:zstd-kmp-okio", version.ref = "zstdOkio" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
injekt-core = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injekt" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# Plugins used by the convention plugins in build-logic/.
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-detekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradle-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintPlugin" }
gradle-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
node = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
