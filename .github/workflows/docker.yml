name: Docker

# Pull requests build the image (both architectures) without pushing. Pushes to main
# publish panelarr/mihon-source:edge; version tags publish the version tags and latest.
# Publishing needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets: without them
# (forks, or before the registry is set up) the image is still built as a check, and
# login and push are skipped.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Secrets can't be used in `if:` conditions, so expose whether they exist.
      HAS_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: panelarr/mihon-source
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Note skipped publish
        if: github.event_name != 'pull_request' && env.HAS_REGISTRY != 'true'
        run: echo "::notice::Docker Hub credentials are not set; building the image without pushing it."

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
