name: Dependency submission

# GitHub's dependency graph reads package manifests (npm, Actions) on its own, but not
# Gradle builds. This resolves the Gradle dependencies of every project on main and
# submits them, so the JVM service's libraries show up in the dependency graph and get
# Dependabot alerts. It can also be run by hand to refresh the graph.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Writing to the dependency graph API needs contents: write.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/dependency-submission@v5
